<!doctype html>
<html><head><meta charset="utf-8"><title>UI test variants</title></head>
<body data-result="">
<script>
/* A/B days (feature harvest item 8): opt-in per split in Settings, separate
   Home buttons, "Last time" prefers the same variant, legacy history is the
   fallback. Run via: node run-ui-tests.js */
const results = [];
function ok(cond, msg) { results.push({ pass: !!cond, msg }); }
function finish() {
  const pass = results.filter(r => r.pass).length;
  const fail = results.filter(r => !r.pass);
  document.body.setAttribute('data-result', JSON.stringify({ pass, fail: fail.length, failMsgs: fail.map(f => f.msg) }));
  document.title = fail.length === 0 ? 'ALL PASS' : 'FAILURES';
}
function click(el) { el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }

const DAY = 24 * 60 * 60 * 1000;
const now = Date.now();
localStorage.clear();
localStorage.setItem('workout-app-v1', JSON.stringify([
  { id: 'legacy', date: now - 5 * DAY, split: 'push', entries: [
    { exercise: 'Bench Press', sets: [{ weight: 40, reps: 10 }] } ] },
]));

const iframe = document.createElement('iframe');
iframe.style.cssText = 'width:390px;height:844px;';
iframe.src = 'index.html';
document.body.appendChild(iframe);

iframe.addEventListener('load', () => {
  const w = iframe.contentWindow, d = iframe.contentDocument;
  w.prompt = () => null;
  w.confirm = () => true;
  w.alert = (msg) => { w.__lastAlert = msg; };
  const $$ = s => [...d.querySelectorAll(s)];
  const title = () => d.getElementById('screenTitle').textContent;
  const txt = el => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');
  const row = name => $$('.ex-row').find(r => r.querySelector('.ex-name').textContent === name);
  const splitBtn = (split, variant) => $$('.split-btn').find(b =>
    b.dataset.split === split && (variant ? b.dataset.variant === variant : !b.dataset.variant));
  const toggleVariant = (split, on) => {
    click(d.getElementById('settingsBtn'));
    const cb = d.querySelector(`input[type="checkbox"][data-variant-split="${split}"]`);
    ok(!!cb, `settings has an A/B checkbox for ${split}`);
    cb.checked = on;
    cb.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const logOne = (name, weight) => {
    click(row(name).querySelector('.ex-head'));
    const body = row(name).querySelector('.ex-body');
    const wIn = body.querySelector('#wVal');
    wIn.value = String(weight); wIn.dispatchEvent(new Event('input', { bubbles: true }));
    click(body.querySelector('#logBtn'));
  };

  setTimeout(() => {
    try {
      ok($$('.split-btn').length === 3, 'A/B off by default: 3 split buttons');
      ok($$('input[data-variant-split]').length === 3, 'one A/B checkbox per split in settings');
      ok($$('input[data-variant-split]').every(cb => !cb.checked), 'all A/B checkboxes start unchecked');

      toggleVariant('push', true);
      ok(JSON.parse(w.localStorage.getItem('workout-variants-v1')).push === true, 'enabling push A/B persists');
      const btns = $$('.split-btn');
      ok(btns.length === 4, 'push A/B on: 4 split buttons, got ' + btns.length);
      ok(JSON.stringify(btns.map(b => b.dataset.split + (b.dataset.variant || ''))) === '["pushA","pushB","pull","legs"]',
         'button order Push A, Push B, Pull, Legs, got ' + btns.map(b => b.dataset.split + (b.dataset.variant || '')).join(','));
      ok(txt(splitBtn('push', 'A')).includes('Push A') && txt(splitBtn('push', 'B')).includes('Push B'), 'buttons are labelled Push A / Push B');

      // ---- Push B: roster + last time fall back to legacy history ----
      click(splitBtn('push', 'B'));
      ok(title() === 'Push B', 'title is "Push B", got ' + title());
      ok(!!row('Bench Press'), 'Push B roster seeded from legacy push history');
      ok(txt(row('Bench Press').querySelector('.ex-summary')) === 'Last: 40×10', 'B with no B history reads legacy last time, got ' + txt(row('Bench Press').querySelector('.ex-summary')));
      logOne('Bench Press', 30);
      click(d.getElementById('finishBtn'));

      click(d.getElementById('historyLink'));
      ok($$('.session-card .session-split').some(el => txt(el).includes('Push B')), 'history labels the session "Push B"');
      click(d.getElementById('backBtn'));

      // ---- Push A: no A history -> legacy, NOT the newer B session ----
      click(splitBtn('push', 'A'));
      ok(title() === 'Push A', 'title is "Push A"');
      ok(txt(row('Bench Press').querySelector('.ex-summary')) === 'Last: 40×10', 'A day falls back to legacy (40), not the newer B day (30), got ' + txt(row('Bench Press').querySelector('.ex-summary')));
      w.prompt = () => 'Cable Fly';
      click(d.getElementById('addExerciseBtn'));
      ok(!!row('Cable Fly'), 'exercise added to the Push A list');
      click(d.getElementById('backBtn'));                 // discard (confirm stubbed true)

      click(splitBtn('push', 'B'));
      ok(txt(row('Bench Press').querySelector('.ex-summary')) === 'Last: 30×10', 'B day reads its own last B session, got ' + txt(row('Bench Press').querySelector('.ex-summary')));
      ok(!row('Cable Fly'), 'Push A and Push B keep separate exercise lists');
      click(d.getElementById('backBtn'));

      // ---- Turning A/B off restores the single button and any-variant last time ----
      toggleVariant('push', false);
      ok($$('.split-btn').length === 3, 'push A/B off again: 3 split buttons');
      click(splitBtn('push'));
      ok(title() === 'Push', 'plain Push title');
      ok(txt(row('Bench Press').querySelector('.ex-summary')) === 'Last: 30×10', 'plain Push reads the most recent of any variant');
    } catch (err) {
      ok(false, 'EXCEPTION: ' + err.message);
    }
    finish();
  }, 150);
});
</script>
</body></html>
